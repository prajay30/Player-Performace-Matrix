<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('home') }}">🏠 Home</a> |
            <a href="{{ url_for('compare') }}">⚔️ Compare</a> |
            <a href="{{ url_for('about') }}">ℹ️ About</a>
        </nav>
    </header>

    <div class="hero-section">
        <h1>⚽ Welcome to Player Performance Matrix</h1>
        <p>Analyze & compare your favorite football players with detailed stats!</p>
        <a href="{{ url_for('compare') }}" class="cta-button">Start Comparing</a>
    </div>

    <!-- 🔍 Search Section -->
    <div class="search-section">
        <h2>🔍 Search for a Player</h2>
        <form action="{{ url_for('search') }}" method="get">
            <input type="text" name="player" placeholder="Enter player name..." required>
            <button type="submit">Search</button>
        </form>
    </div>
</body>
</html>
